plugins {
    id 'com.android.application'
}

android {
    namespace 'com.droidoperator.service'
    compileSdk 34

    defaultConfig {
        applicationId "com.droidoperator.service"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Zero dependencies - pure Android Framework APIs
}
