name: Build DroidOperator APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Gradle & Build APK
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        export PATH=$PWD/gradle-8.5/bin:$PATH
        export ANDROID_HOME=/usr/local/lib/android/sdk
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        cd droid_operator
        gradle assembleDebug --stacktrace 2>&1 | tee ../build.log

    - name: Commit Build Log
      if: always()
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git checkout -B build-log-branch
        git add -f build.log
        git commit -m "chore: save build log" || true
        git push -f origin build-log-branch || true

    - name: Release APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.1-droid
        name: DroidOperator v1.0.1
        files: droid_operator/android_service/app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
